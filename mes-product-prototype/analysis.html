<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>统计分析 · 制造与供应链协同平台</title>
<link rel="stylesheet" href="assets/styles.css">
</head>
<body data-page="analysis">

<aside class="app-nav" id="appNav"></aside>
<div class="app-body">
  <header class="app-topbar" id="appTopbar"></header>
  <main class="app-content">
    <div class="page-head">
      <div>
        <div class="page-title">统计分析</div>
        <div class="page-sub">产出 · 达成 · OEE · 质量 · 停机</div>
      </div>
      <div class="spacer"></div>
      <div class="page-actions">
        <div class="btn-group" id="rangeSeg" data-seg>
          <button data-value="7">近 7 天</button>
          <button class="active" data-value="30">近 30 天</button>
          <button data-value="month">本月</button>
        </div>
        <button class="btn primary" id="btnExport"></button>
      </div>
    </div>

    <div id="kpiGrid" class="grid-4 mb-16"></div>

    <div class="grid-2-1 mb-16">
      <section class="card">
        <div class="card-head">
          <div class="card-title" id="trendTitle"></div>
          <span class="card-sub" id="trendSub">单位：台</span>
          <div class="spacer"></div>
          <span class="tag info" id="rangeTag">近 30 天</span>
        </div>
        <div class="card-body">
          <div id="trendBars"></div>
          <div class="divider"></div>
          <div class="between mb-8">
            <span class="hint">产出走势叠加</span>
            <span class="mono sub" id="trendSummary">—</span>
          </div>
          <div id="trendSpark"></div>
          <div class="chart-axis" id="trendAxis"></div>
        </div>
      </section>

      <section class="card">
        <div class="card-head">
          <div class="card-title" id="monthTitle"></div>
          <div class="spacer"></div>
          <span class="tag mute">月度</span>
        </div>
        <div class="card-body">
          <div id="monthBars"></div>
          <div class="divider"></div>
          <div class="hint">10 月尚未结账，数据截至 10-25 白班。</div>
        </div>
      </section>
    </div>

    <div class="grid-2 mb-16">
      <section class="card">
        <div class="card-head">
          <div class="card-title" id="oeeTitle"></div>
          <div class="spacer"></div>
          <span class="tag warn">目标 ≥ 80%</span>
        </div>
        <div class="card-body">
          <div id="oeeBars"></div>
          <div class="divider"></div>
          <div class="legend">
            <span class="lg"><span class="dot primary"></span>达标</span>
            <span class="lg"><span class="dot accent"></span>低于 80%</span>
          </div>
        </div>
      </section>

      <section class="card">
        <div class="card-head">
          <div class="card-title" id="defectTitle"></div>
          <div class="spacer"></div>
          <span class="tag accent">Top 1：装配间隙</span>
        </div>
        <div class="card-body">
          <div id="defectBars"></div>
          <div class="divider"></div>
          <div class="hint">缺陷按数量降序排列，首项为当前主要改善方向。</div>
        </div>
      </section>
    </div>

    <section class="card">
      <div class="card-head">
        <div class="card-title" id="compareTitle"></div>
        <span class="card-sub">点击行查看产线指标详情</span>
        <div class="spacer"></div>
        <span class="tag outline">6 条产线</span>
      </div>
      <div class="card-body tight" id="lineTable"></div>
    </section>
  </main>
</div>

<script src="assets/mock.js"></script>
<script src="assets/api.js"></script>
<script src="assets/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var M = MESUI;
  var A = DB.analysis;
  var LABEL = { '7': '近 7 天', '30': '近 30 天', month: '本月' };
  var currentRange = '30';

  document.getElementById('btnExport').innerHTML = M.icon('download') + '导出报表';
  document.getElementById('trendTitle').innerHTML = M.icon('trend') + '产出趋势';
  document.getElementById('monthTitle').innerHTML = M.icon('chart') + '月度产出';
  document.getElementById('oeeTitle').innerHTML = M.icon('gauge') + 'OEE 产线对比';
  document.getElementById('defectTitle').innerHTML = M.icon('alert') + '缺陷 Pareto';
  document.getElementById('compareTitle').innerHTML = M.icon('activity') + '产线对比';

  /* 时间范围派生 */
  function kpisFor(key) {
    if (key === '7') {
      return [
        { label: '近 7 天产出', value: '8,928', unit: '台', tone: 'ok', delta: '+2.4%', trend: 'up', foot: '日均 1,275 台', icon: 'box' },
        { label: '计划达成率', value: '92.3', unit: '%', tone: 'warn', delta: '+0.8%', trend: 'up', foot: '目标 ≥ 92%', icon: 'target' },
        { label: '平均 OEE', value: '82.9', unit: '%', tone: 'ok', delta: '+1.9%', trend: 'up', foot: '环比 +1.4%', icon: 'gauge' },
        { label: '不良率', value: '2.5', unit: '%', tone: 'ok', delta: '-0.3%', trend: 'up', foot: '目标 ≤ 3%', icon: 'shield' }
      ];
    }
    if (key === '30') {
      return [
        { label: '近 30 天产出', value: '28,140', unit: '台', tone: 'ok', delta: '+4.3%', trend: 'up', foot: '同比 +6.9%', icon: 'box' },
        { label: '计划达成率', value: '87.4', unit: '%', tone: 'warn', delta: '+1.3%', trend: 'up', foot: '目标 ≥ 92%', icon: 'target' },
        { label: '平均 OEE', value: '82.4', unit: '%', tone: 'ok', delta: '+2.0%', trend: 'up', foot: '环比 +1.5%', icon: 'gauge' },
        { label: '不良率', value: '2.7', unit: '%', tone: 'ok', delta: '-0.3%', trend: 'up', foot: '目标 ≤ 3%', icon: 'shield' }
      ];
    }
    return A.kpis;
  }

  function renderTrend(key) {
    var rows;
    if (key === 'month') {
      rows = A.monthly.map(function (x) { return { h: x.h, v: x.v }; });
    } else {
      rows = (key === '7' ? A.outputTrend.slice(-7) : A.outputTrend).map(function (x) {
        return { h: x.d.slice(-5), v: x.v };
      });
    }
    M.vbars('#trendBars', rows, { unit: '台' });
    M.sparkline('#trendSpark', rows.map(function (x) { return x.v; }), key === 'month' ? 'primary' : 'accent');
    document.getElementById('trendAxis').innerHTML = [rows[0], rows[Math.floor(rows.length / 2)], rows[rows.length - 1]].map(function (x) {
      return '<span>' + M.esc(x.h) + '</span>';
    }).join('');
    var values = rows.map(function (x) { return x.v; });
    var min = Math.min.apply(null, values);
    var max = Math.max.apply(null, values);
    var sum = values.reduce(function (s, v) { return s + v; }, 0);
    document.getElementById('trendSummary').textContent = '合计 ' + M.num(sum) + ' 台 · 最高 ' + M.num(max) + ' · 最低 ' + M.num(min);
    document.getElementById('rangeTag').textContent = LABEL[key];
  }

  M.kpi('#kpiGrid', A.kpis);
  renderTrend('30');

  M.bindSeg(document, function (key) {
    currentRange = key;
    renderTrend(key);
    M.kpi('#kpiGrid', kpisFor(key));
    M.toast('统计口径：' + LABEL[key], 'info');
  });

  /* 月度产出 */
  M.vbars('#monthBars', A.monthly.map(function (x) { return { h: x.h, v: x.v }; }), { unit: '台' });

  /* OEE 与缺陷 Pareto（点击下钻） */
  M.bars('#oeeBars', A.oeeByLine.map(function (x) {
    return {
      name: x.name, v: x.v, tone: x.v < 80 ? 'accent' : '',
      href: MES.url('equipment.html', { tab: 'list', q: x.name })
    };
  }), { unit: '%', max: 100 });

  M.bars('#defectBars', A.defectPareto.map(function (x, i) {
    return {
      name: x.name, v: x.v, tone: i === 0 ? 'accent' : '',
      href: MES.url('quality.html', { q: x.name, mount: '#issueTable' })
    };
  }), { max: 40 });

  /* 产线对比表 */
  var lineCols = [
    { key: 'line', label: '产线', formatter: function (r) { return '<span class="mono" style="font-weight:600">' + M.esc(r.line) + '</span>'; } },
    { key: 'out', label: '产出', cls: 'num', formatter: function (r) { return M.num(r.out); }, csv: function (r) { return r.out; } },
    { key: 'plan', label: '计划', cls: 'num', formatter: function (r) { return M.num(r.plan); }, csv: function (r) { return r.plan; } },
    { key: 'rate', label: '达成率', sortable: false, formatter: function (r) {
      return '<div style="min-width:96px">' + M.progress(r.rate, M.pctTone(r.rate)) + '<span class="mono hint">' + r.rate.toFixed(1) + '%</span></div>';
    } },
    { key: 'ftt', label: 'FTT', cls: 'num', formatter: function (r) { return r.ftt + '%'; } },
    { key: 'oee', label: 'OEE', cls: 'num', formatter: function (r) { return r.oee + '%'; } },
    { key: 'down', label: '停机(min)', cls: 'num' },
    { key: 'pp', label: '人均产出', cls: 'num' }
  ];

  M.table({
    mount: '#lineTable',
    columns: lineCols,
    rows: A.lineCompare,
    pageSize: 6,
    search: false,
    exportName: '产线对比',
    rowClass: function (r) { return r.oee < 80 ? 'row-warn' : ''; },
    onRowClick: function (r) { openLine(r); }
  });

  function openLine(r) {
    M.drawer({
      title: r.line + ' · 产线指标',
      sub: '统计口径：' + LABEL[currentRange] + ' · 数据来源：报工 / 设备采集',
      body: '<div class="split mb-16">' +
          '<div class="center" style="flex-direction:column;gap:8px">' +
            M.ring(r.rate, '计划达成率') +
            '<div class="big-num">' + M.num(r.out) + '<span class="u">/ ' + M.num(r.plan) + ' 台</span></div>' +
          '</div>' +
          '<div data-line-dl></div>' +
        '</div>' +
        '<div class="divider"></div>' +
        '<div class="hint mb-8">质量与效率</div>' +
        '<div data-line-bars></div>' +
        '<div class="note" style="margin-top:12px">停机 ' + r.down + ' 分钟，人均产出 ' + r.pp + ' 台/人；OEE ' + r.oee + '%' +
          (r.oee < 80 ? '，低于 80% 目标，建议优先排查瓶颈工序。' : '，处于目标区间。') + '</div>',
      footer: '<button class="btn" data-close>关闭</button><div class="spacer"></div><a class="btn primary" href="production.html">查看生产执行</a>',
      onMount: function (card) {
        M.dl(card.querySelector('[data-line-dl]'), [
          ['产出 / 计划', M.num(r.out) + ' / ' + M.num(r.plan) + ' 台'],
          ['达成率', r.rate.toFixed(1) + '%'],
          ['一次合格率 FTT', r.ftt + '%'],
          ['综合效率 OEE', r.oee + '%'],
          ['停机时长', r.down + ' min'],
          ['人均产出', r.pp + ' 台/人']
        ]);
        M.bars(card.querySelector('[data-line-bars]'), [
          { name: '达成率', v: r.rate, tone: r.rate < 90 ? 'accent' : 'ok' },
          { name: 'FTT', v: r.ftt, tone: 'ok' },
          { name: 'OEE', v: r.oee, tone: r.oee < 80 ? 'accent' : 'ok' }
        ], { unit: '%', max: 100 });
      }
    });
  }

  /* 导出 */
  document.getElementById('btnExport').addEventListener('click', function () {
    M.exportCsv('产线对比', lineCols, A.lineCompare);
  });
});
</script>
</body>
</html>
