<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>库存管理 · 制造与供应链协同平台</title>
<link rel="stylesheet" href="assets/styles.css">
</head>
<body data-page="inventory">

<aside class="app-nav" id="appNav"></aside>
<div class="app-body">
  <header class="app-topbar" id="appTopbar"></header>
  <main class="app-content">
    <div class="page-head">
      <div>
        <div class="page-title">库存管理</div>
        <div class="page-sub">实时库存 · 出入库 · 调拨 · 盘点 · 库存预警 · 库龄</div>
      </div>
      <div class="spacer"></div>
      <div class="page-actions">
        <button class="btn" id="btnOtherOut"></button>
        <button class="btn primary" id="btnOtherIn"></button>
      </div>
    </div>

    <div id="kpiGrid" class="grid-4 stagger mb-16"></div>

    <div class="grid-4 mb-16" id="warehouseGrid"></div>

    <section class="card">
      <div class="card-head">
        <div class="card-title" id="ledgerTitle"></div>
        <span class="card-sub">4 个仓库 · 386 SKU · WMS 实时同步</span>
        <div class="spacer"></div>
        <div class="card-extra">
          <button class="btn sm" id="btnTransfer"></button>
          <button class="btn sm" id="btnStocktake"></button>
          <button class="btn sm" id="btnThreshold"></button>
          <button class="btn sm ghost" id="btnExportStock"></button>
        </div>
      </div>
      <div class="card-body tight">
        <div class="tabs" data-tabs id="invTabs" style="padding:0 14px">
          <button class="tab active" data-tab="stock">实时库存</button>
          <button class="tab" data-tab="inbound">入库单据</button>
          <button class="tab" data-tab="outbound">出库单据</button>
          <button class="tab" data-tab="move">调拨与盘点</button>
          <button class="tab" data-tab="alert">库存预警</button>
          <button class="tab" data-tab="aging">库龄分析</button>
        </div>
        <div class="tab-panel" data-panel="stock"><div id="stockTable"></div></div>
        <div class="tab-panel hidden" data-panel="inbound"><div id="inboundTable"></div></div>
        <div class="tab-panel hidden" data-panel="outbound"><div id="outboundTable"></div></div>
        <div class="tab-panel hidden" data-panel="move">
          <div class="flex between" style="padding:10px 14px;border-bottom:1px solid var(--border)">
            <span class="card-title" id="transferTitle"></span>
            <span class="tag info">出库 / 入库自动联动</span>
          </div>
          <div id="transferTable"></div>
          <div class="flex between" style="padding:10px 14px;border-top:1px solid var(--border);border-bottom:1px solid var(--border)">
            <span class="card-title" id="stocktakeTitle"></span>
            <span class="tag warn">差异自动生成调整单</span>
          </div>
          <div id="stocktakeTable"></div>
        </div>
        <div class="tab-panel hidden" data-panel="alert"><div id="alertTable"></div></div>
        <div class="tab-panel hidden" data-panel="aging">
          <div class="card-body">
            <div class="between mb-8"><span class="hint">库龄金额分布</span><span class="mono sub">单位：万元</span></div>
            <div id="agingBars"></div>
          </div>
          <div id="agingTable"></div>
        </div>
      </div>
    </section>
  </main>
</div>

<script src="assets/mock.js"></script>
<script src="assets/api.js"></script>
<script src="assets/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var M = MESUI;
  var I = DB.inventory;

  document.getElementById('btnOtherOut').innerHTML = M.icon('truck') + '其他出库';
  document.getElementById('btnOtherIn').innerHTML = M.icon('plus') + '其他入库';
  document.getElementById('btnTransfer').innerHTML = M.icon('sync') + '调拨';
  document.getElementById('btnStocktake').innerHTML = M.icon('clipboard') + '盘点';
  document.getElementById('btnThreshold').innerHTML = M.icon('settings') + '预警设置';
  document.getElementById('btnExportStock').innerHTML = M.icon('download') + '导出库存';
  document.getElementById('ledgerTitle').innerHTML = M.icon('warehouse') + '库存台账';
  document.getElementById('transferTitle').innerHTML = M.icon('sync') + '调拨单';
  document.getElementById('stocktakeTitle').innerHTML = M.icon('clipboard') + '盘点单';

  /* KPI */
  M.kpi('#kpiGrid', I.kpis, 4);

  /* 仓库卡 */
  document.getElementById('warehouseGrid').innerHTML = I.warehouses.map(function (w) {
    var pct = Math.round(w.used / w.locations * 100);
    var tone = w.tone || (w.alert ? 'warn' : 'ok');
    return '<section class="card">' +
      '<div class="card-head"><div class="card-title">' + M.icon('warehouse') + M.esc(w.name) + '</div>' +
        '<div class="spacer"></div>' + M.tag(w.alert ? w.alert + ' 项预警' : '无预警', tone) + '</div>' +
      '<div class="card-body">' +
        '<div class="hint mb-8">' + M.esc(w.meta) + '</div>' +
        '<div class="meter-row mb-12"><span class="meter-label">库位占用</span>' +
          M.progress(pct, pct >= 90 ? 'warn' : 'ok') +
          '<span class="meter-val">' + pct + '%</span></div>' +
        '<div class="between"><span class="hint">占用库位</span><span class="mono">' + M.num(w.used) + ' / ' + M.num(w.locations) + '</span></div>' +
        '<div class="between mt-8"><span class="hint">库存金额</span><span class="mono">' + M.esc(w.value) + '</span></div>' +
        '<div class="between mt-8"><span class="hint">预警项</span>' +
          (w.alert ? '<span class="tag warn">' + w.alert + ' 项</span>' : '<span class="tag ok">无</span>') + '</div>' +
      '</div></section>';
  }).join('');

  /* 实时库存 */
  var stockCols = [
    { key: 'code', label: '物料编码', cls: 'mono' },
    { key: 'name', label: '名称' },
    { key: 'category', label: '分类', formatter: function (r) { return '<span class="tag outline">' + M.esc(r.category) + '</span>'; } },
    { key: 'warehouse', label: '仓库' },
    { key: 'qty', label: '库存', cls: 'num', formatter: function (r) { return M.num(r.qty); } },
    { key: 'unit', label: '单位' },
    { key: 'amount', label: '金额(万元)', cls: 'num', formatter: function (r) { return M.num(r.amount); } },
    { key: 'safe', label: '安全库存', cls: 'num', formatter: function (r) { return M.num(r.safe); } },
    { key: 'status', label: '状态', formatter: function (r) { return M.tag(r.status); } }
  ];
  var stockTable = M.table({
    mount: '#stockTable', columns: stockCols, rows: I.stock, pageSize: 8,
    exportName: '实时库存', searchPlaceholder: '搜索物料编码 / 名称 / 仓库',
    selectable: true, rowKey: 'code',
    batchActions: [{ act: 'export', label: '导出所选' }, { act: 'pr', label: '生成采购申请' }],
    onBatch: function (act, sel) {
      if (act !== 'pr' || !sel.length) return;
      M.toast('已为 ' + sel.length + ' 个物料生成采购申请 PR-261025-006，等待采购确认', 'ok');
    },
    rowClass: function (r) { return r.status === '缺料' ? 'row-danger' : (r.status === '预警' || r.status === '呆滞') ? 'row-warn' : ''; },
    onRowClick: openStock
  });

  /* 入库单据 */
  var inboundTable = M.table({
    mount: '#inboundTable',
    columns: [
      { key: 'no', label: '入库单号', cls: 'mono' },
      { key: 'type', label: '类型', formatter: function (r) { return '<span class="tag outline">' + M.esc(r.type) + '</span>'; } },
      { key: 'source', label: '来源' },
      { key: 'warehouse', label: '仓库' },
      { key: 'qty', label: '数量', cls: 'num', formatter: function (r) { return M.num(r.qty); } },
      { key: 'amount', label: '金额(万元)', cls: 'num', formatter: function (r) { return M.num(r.amount); } },
      { key: 'date', label: '日期', cls: 'mono' },
      { key: 'status', label: '状态', formatter: function (r) { return M.tag(r.status); } }
    ],
    rows: I.inbound, pageSize: 6, exportName: '入库单据',
    searchPlaceholder: '搜索单号 / 类型 / 来源', empty: '暂无入库单据'
  });

  /* 出库单据 */
  var outboundTable = M.table({
    mount: '#outboundTable',
    columns: [
      { key: 'no', label: '出库单号', cls: 'mono' },
      { key: 'type', label: '类型', formatter: function (r) { return '<span class="tag outline">' + M.esc(r.type) + '</span>'; } },
      { key: 'target', label: '去向' },
      { key: 'warehouse', label: '仓库' },
      { key: 'qty', label: '数量', cls: 'num', formatter: function (r) { return M.num(r.qty); } },
      { key: 'amount', label: '金额(万元)', cls: 'num', formatter: function (r) { return M.num(r.amount); } },
      { key: 'date', label: '日期', cls: 'mono' },
      { key: 'status', label: '状态', formatter: function (r) { return M.tag(r.status); } }
    ],
    rows: I.outbound, pageSize: 6, exportName: '出库单据',
    searchPlaceholder: '搜索单号 / 类型 / 去向', empty: '暂无出库单据'
  });

  /* 调拨单 */
  var transferTable = M.table({
    mount: '#transferTable',
    columns: [
      { key: 'no', label: '调拨单号', cls: 'mono' },
      { key: 'from', label: '调出仓库' },
      { key: 'to', label: '调入仓库' },
      { key: 'material', label: '物料' },
      { key: 'qty', label: '数量', cls: 'num', formatter: function (r) { return M.num(r.qty); } },
      { key: 'date', label: '日期', cls: 'mono' },
      { key: 'status', label: '状态', formatter: function (r) { return M.tag(r.status); } }
    ],
    rows: I.transfers, pageSize: 5, exportName: '调拨单',
    searchPlaceholder: '搜索调拨单号 / 物料'
  });

  /* 盘点单 */
  var stocktakeTable = M.table({
    mount: '#stocktakeTable',
    columns: [
      { key: 'no', label: '盘点单号', cls: 'mono' },
      { key: 'warehouse', label: '仓库' },
      { key: 'planDate', label: '计划日期', cls: 'mono' },
      { key: 'counted', label: '盘点数量', cls: 'num', formatter: function (r) { return M.num(r.counted); } },
      { key: 'diff', label: '差异', cls: 'num', formatter: function (r) {
        if (r.diff > 0) return '<span style="color:var(--success)">+' + r.diff + '</span>';
        if (r.diff < 0) return '<span style="color:var(--danger)">' + r.diff + '</span>';
        return '<span class="muted">0</span>';
      } },
      { key: 'status', label: '状态', formatter: function (r) { return M.tag(r.status); } }
    ],
    rows: I.stocktakes, pageSize: 4, exportName: '盘点单', search: false,
    rowClass: function (r) { return r.diff !== 0 ? 'row-warn' : ''; }
  });

  /* 库存预警 */
  var alertCols = [
    { key: 'material', label: '物料' },
    { key: 'code', label: '编码', cls: 'mono' },
    { key: 'warehouse', label: '仓库' },
    { key: 'current', label: '当前库存', cls: 'num', formatter: function (r) { return M.num(r.current); } },
    { key: 'safe', label: '安全库存', cls: 'num', formatter: function (r) { return M.num(r.safe); } },
    { key: 'type', label: '预警类型', formatter: function (r) { return M.tag(r.type, 'warn'); } },
    { key: 'owner', label: '责任人' },
    { key: 'status', label: '状态', formatter: function (r) { return M.tag(r.status); } },
    { label: '操作', sortable: false, formatter: function () { return '<button class="btn sm" data-act="pr">生成采购申请</button>'; } }
  ];
  var alertTable = M.table({
    mount: '#alertTable', columns: alertCols, rows: I.alerts, pageSize: 5,
    exportName: '库存预警', searchPlaceholder: '搜索物料 / 编码 / 仓库',
    onAction: function (act, r) {
      if (act === 'pr' && r) M.toast('采购申请 PR-261025-006 已生成（演示）', 'ok');
    }
  });

  /* 库龄分析 */
  M.bars('#agingBars', I.aging.map(function (a) {
    return { name: a.range, v: a.amount };
  }), { unit: ' 万' });
  M.table({
    mount: '#agingTable',
    columns: [
      { key: 'range', label: '库龄区间' },
      { key: 'sku', label: 'SKU 数', cls: 'num', formatter: function (r) { return M.num(r.sku); } },
      { key: 'amount', label: '金额(万元)', cls: 'num', formatter: function (r) { return M.num(r.amount); } }
    ],
    rows: I.aging, pageSize: 4, exportName: '库龄分析', search: false
  });

  M.bindTabs(document);

  /* ---------- 交互 ---------- */
  document.getElementById('btnExportStock').addEventListener('click', function () {
    M.exportCsv('实时库存', stockCols, I.stock);
  });

  /* 库存明细抽屉 */
  function openStock(r) {
    var pct = Math.min(100, Math.round(r.qty / r.max * 100));
    var gap = r.safe - r.qty;
    var note;
    if (r.status === '呆滞') {
      note = '<div class="note warn"><b>呆滞提示</b>：该物料库存 ' + M.num(r.qty) + ' ' + M.esc(r.unit) +
        '，安全库存 ' + M.num(r.safe) + '，库龄已超过 90 天，建议发起调拨或折价处理。</div>';
    } else if (gap > 0) {
      note = '<div class="note ' + (r.status === '缺料' ? 'danger' : 'warn') + '"><b>水位提示</b>：当前库存 ' + M.num(r.qty) + ' ' + M.esc(r.unit) +
        '，安全库存 ' + M.num(r.safe) + '，缺口 ' + M.num(gap) + '；建议立即补货或拉动。</div>';
    } else {
      note = '<div class="note"><b>水位提示</b>：当前库存 ' + M.num(r.qty) + ' ' + M.esc(r.unit) +
        '，高于安全库存 ' + M.num(r.safe) + '，库存水位正常。</div>';
    }
    var step = Math.max(10, Math.round(r.qty * 0.08));

    M.drawer({
      title: r.name,
      sub: r.code + ' · ' + r.warehouse,
      body: '<div id="stockDl" class="mb-16"></div>' +
        '<div class="divider"></div>' +
        '<div class="between mb-8"><span class="hint">库存水位（相对最高库存）</span><span class="mono sub">' + pct + '%</span></div>' +
        '<div id="stockBar" class="mb-12"></div>' + note +
        '<div class="divider"></div>' +
        '<div class="hint mb-8">近 5 次出入库</div><div id="stockTl"></div>',
      footer: '<button class="btn" data-close>关闭</button><div class="spacer"></div>' +
        '<button class="btn" id="stockSet">调整阈值</button>' +
        '<button class="btn primary" id="stockMove">发起调拨</button>',
      onMount: function (card, close) {
        M.dl(card.querySelector('#stockDl'), [
          ['物料编码', r.code], ['名称', r.name], ['分类', r.category], ['仓库', r.warehouse],
          ['当前库存', M.num(r.qty) + ' ' + r.unit], ['库存金额', M.num(r.amount) + ' 万元'],
          ['安全库存', M.num(r.safe)], ['最低 / 最高', M.num(r.min) + ' / ' + M.num(r.max)],
          ['状态', M.tag(r.status), 'html']
        ]);
        card.querySelector('#stockBar').innerHTML = M.progress(pct,
          r.status === '缺料' ? 'danger' : r.status === '预警' ? 'warn' : 'ok', 'lg');
        M.timeline(card.querySelector('#stockTl'), [
          { tone: 'ok', title: '入库 ' + M.num(step + 120) + ' ' + r.unit, time: '10-25 11:35', body: '采购入库 · ' + M.esc(r.warehouse) },
          { tone: 'info', title: '出库 ' + M.num(step + 40) + ' ' + r.unit, time: '10-25 10:20', body: '生产领料 · 工单 WO-261025-003' },
          { tone: 'info', title: '出库 ' + M.num(step) + ' ' + r.unit, time: '10-24 16:40', body: '生产领料 · 工单 WO-261024-011' },
          { tone: 'ok', title: '入库 ' + M.num(step * 2) + ' ' + r.unit, time: '10-24 09:15', body: '采购入库 · 供应商来料' },
          { tone: 'warn', title: '盘点差异 0', time: '10-23 18:00', body: '月度抽盘 · 账实一致' }
        ]);
        card.querySelector('#stockSet').addEventListener('click', function () {
          close();
          openThreshold(r);
        });
        card.querySelector('#stockMove').addEventListener('click', function () {
          close();
          openTransfer({ code: r.code, from: r.warehouse });
        });
      }
    });
  }

  function warehouseOptions(selected) {
    return I.warehouses.map(function (w) {
      return '<option value="' + M.esc(w.name) + '"' + (w.name === selected ? ' selected' : '') + '>' + M.esc(w.name) + '</option>';
    }).join('');
  }

  function materialOptions(selectedCode) {
    return I.stock.map(function (s) {
      return '<option value="' + M.esc(s.code) + '"' + (s.code === selectedCode ? ' selected' : '') + '>' +
        M.esc(s.code + ' · ' + s.name) + '（' + M.esc(s.warehouse) + '）</option>';
    }).join('');
  }

  function findStock(code) {
    var found = I.stock.filter(function (s) { return s.code === code; });
    return found.length ? found[0] : null;
  }

  /* 其他入库 */
  function openInbound() {
    var body = '<div class="form-grid">' +
      '<div class="field"><span class="label">仓库</span><select class="select" id="inWarehouse">' + warehouseOptions() + '</select></div>' +
      '<div class="field"><span class="label">物料</span><select class="select" id="inMaterial">' + materialOptions() + '</select></div>' +
      '<div class="field"><span class="label">数量</span><input class="input" id="inQty" type="number" min="1" value="100"></div>' +
      '<div class="field"><span class="label">金额（万元）</span><input class="input" id="inAmount" type="number" min="0" step="0.1" value="0"></div>' +
      '<div class="field full"><span class="label">原因</span><select class="select" id="inReason">' +
        '<option>盘盈调整</option><option>供应商赠品</option><option>退货入库</option><option>其他</option>' +
      '</select></div>' +
    '</div>' +
    '<div class="note" style="margin-top:12px">提交后生成其他入库单，计入实时库存并进入存货核算待记账队列。</div>';

    M.modal({
      title: '其他入库',
      body: body,
      footer: '<div class="spacer"></div><button class="btn" data-close>取消</button><button class="btn primary" id="inSubmit">确认入库</button>',
      onMount: function (card, close) {
        card.querySelector('#inSubmit').addEventListener('click', function () {
          var qty = Number(card.querySelector('#inQty').value) || 0;
          if (qty <= 0) { M.toast('请填写大于 0 的入库数量', 'warn'); return; }
          var code = card.querySelector('#inMaterial').value;
          var item = findStock(code);
          var amount = Number(card.querySelector('#inAmount').value) || 0;
          if (I.inbound.some(function (x) { return x.no === 'RK-261025-013'; })) {
            M.toast('该入库单已生成，请勿重复提交', 'warn');
            return;
          }
          if (item) {
            item.qty += qty;
            item.amount = Number((item.amount + amount).toFixed(1));
            item.status = item.qty >= item.safe ? '正常' : '预警';
          }
          I.inbound.unshift({
            no: 'RK-261025-013', type: '其他入库', source: card.querySelector('#inReason').value,
            warehouse: card.querySelector('#inWarehouse').value, qty: qty, amount: amount,
            date: '2026-10-25', status: '待审核'
          });
          if (DB.costing && DB.costing.vouchers) {
            DB.costing.vouchers.unshift({ no: 'JZ-261025-010', type: '其他入库', source: 'RK-261025-013', amount: amount, period: '2026-10', status: '待记账', time: '12:20' });
          }
          MES.save();
          stockTable.refresh(I.stock);
          inboundTable.refresh(I.inbound);
          close();
          M.toast('其他入库单已生成：RK-261025-013，库存已增加', 'ok');
        });
      }
    });
  }

  /* 其他出库 */
  function openOutbound() {
    var body = '<div class="form-grid">' +
      '<div class="field"><span class="label">仓库</span><select class="select" id="outWarehouse">' + warehouseOptions() + '</select></div>' +
      '<div class="field"><span class="label">物料</span><select class="select" id="outMaterial">' + materialOptions() + '</select></div>' +
      '<div class="field"><span class="label">数量</span><input class="input" id="outQty" type="number" min="1" value="1"></div>' +
      '<div class="field"><span class="label">领用部门</span><select class="select" id="outDept">' +
        '<option>研发部</option><option>设备部</option><option>质量部</option><option>行政部</option>' +
      '</select></div>' +
      '<div class="field full"><span class="label">原因</span><textarea class="textarea" id="outReason" placeholder="例如：研发样机试制领用 / 设备维修备件领用"></textarea></div>' +
    '</div>' +
    '<div class="note" style="margin-top:12px">其他出库不计入销售出库，需填写领用部门与原因，审批通过后扣减库存。</div>';

    M.modal({
      title: '其他出库',
      body: body,
      footer: '<div class="spacer"></div><button class="btn" data-close>取消</button><button class="btn primary" id="outSubmit">确认出库</button>',
      onMount: function (card, close) {
        card.querySelector('#outSubmit').addEventListener('click', function () {
          var qty = Number(card.querySelector('#outQty').value) || 0;
          if (qty <= 0) { M.invalid(card.querySelector('#outQty'), '请输入大于 0 的出库数量'); return; }
          var code = card.querySelector('#outMaterial').value;
          var item = findStock(code);
          if (!item) { M.toast('未找到该物料库存', 'warn'); return; }
          if (qty > item.qty) { M.invalid(card.querySelector('#outQty'), '最多可出库 ' + item.qty); return; }
          if (I.outbound.some(function (x) { return x.no === 'CK-261025-019'; })) {
            M.toast('该出库单已生成，请勿重复提交', 'warn');
            return;
          }
          var unit = item.qty ? item.amount / item.qty : 0;
          var amount = Number((unit * qty).toFixed(1));
          item.qty -= qty;
          item.amount = Number(Math.max(0, item.amount - amount).toFixed(1));
          item.status = item.qty <= 0 ? '缺料' : item.qty < item.safe ? '预警' : '正常';
          I.outbound.unshift({
            no: 'CK-261025-019', type: '其他出库',
            target: card.querySelector('#outDept').value + ' 领用',
            warehouse: item.warehouse, qty: qty, amount: amount, date: '2026-10-25', status: '待审核'
          });
          if (DB.costing && DB.costing.vouchers) {
            DB.costing.vouchers.unshift({ no: 'JZ-261025-011', type: '其他出库', source: 'CK-261025-019', amount: amount, period: '2026-10', status: '待记账', time: '12:24' });
          }
          MES.save();
          stockTable.refresh(I.stock);
          outboundTable.refresh(I.outbound);
          close();
          M.toast('其他出库单已生成：CK-261025-019，库存已扣减', 'ok');
        });
      }
    });
  }

  /* 调拨 */
  function openTransfer(preset) {
    preset = preset || {};
    var body = '<div class="form-grid">' +
      '<div class="field"><span class="label">从仓库</span><select class="select" id="trFrom">' + warehouseOptions(preset.from) + '</select></div>' +
      '<div class="field"><span class="label">到仓库</span><select class="select" id="trTo">' + warehouseOptions(preset.to) + '</select></div>' +
      '<div class="field full"><span class="label">物料</span><select class="select" id="trMaterial">' + materialOptions(preset.code) + '</select></div>' +
      '<div class="field"><span class="label">数量</span><input class="input" id="trQty" type="number" min="1" value="100"></div>' +
    '</div>' +
    '<div class="note" style="margin-top:12px">提交后自动生成调出仓出库单与调入仓入库单，两仓库存同步更新。</div>';

    M.modal({
      title: '库存调拨',
      body: body,
      footer: '<div class="spacer"></div><button class="btn" data-close>取消</button><button class="btn primary" id="trSubmit">提交调拨</button>',
      onMount: function (card, close) {
        card.querySelector('#trSubmit').addEventListener('click', function () {
          var from = card.querySelector('#trFrom').value;
          var to = card.querySelector('#trTo').value;
          var qty = Number(card.querySelector('#trQty').value) || 0;
          if (from === to) { M.toast('调出仓库与调入仓库不能相同', 'warn'); return; }
          if (qty <= 0) { M.toast('请填写大于 0 的调拨数量', 'warn'); return; }
          var code = card.querySelector('#trMaterial').value;
          var item = findStock(code);
          if (!I.transfers.some(function (x) { return x.no === 'DB-261025-005'; })) {
            I.transfers.unshift({
              no: 'DB-261025-005', from: from, to: to,
              material: item ? item.name : code, qty: qty, date: '2026-10-25', status: '已调拨'
            });
            if (item && qty >= item.qty) item.warehouse = to;
          }
          MES.save();
          transferTable.refresh(I.transfers);
          stockTable.refresh(I.stock);
          close();
          M.toast('调拨单已生成，出库/入库单自动联动', 'ok');
        });
      }
    });
  }

  /* 盘点 */
  function openStocktake() {
    var body = '<div class="form-grid">' +
      '<div class="field full"><span class="label">盘点仓库</span><select class="select" id="pdWarehouse">' + warehouseOptions() + '</select></div>' +
      '<div class="field full"><span class="label">盘点数量</span><input class="input" id="pdCount" type="number" min="0" value="0"></div>' +
      '<div class="field full"><span class="label">差异原因</span><select class="select" id="pdReason">' +
        '<option>账实相符</option><option>收发计量误差</option><option>单据漏录</option><option>物料损耗</option><option>其他</option>' +
      '</select></div>' +
    '</div>' +
    '<div class="note" style="margin-top:12px">提交后生成盘点单；差异不为 0 时将自动生成其他出入库单并同步存货核算。</div>';

    M.modal({
      title: '库存盘点',
      body: body,
      footer: '<div class="spacer"></div><button class="btn" data-close>取消</button><button class="btn primary" id="pdSubmit">提交盘点</button>',
      onMount: function (card, close) {
        card.querySelector('#pdSubmit').addEventListener('click', function () {
          var counted = Number(card.querySelector('#pdCount').value) || 0;
          if (counted < 0) { M.toast('盘点数量不能为负数', 'warn'); return; }
          var wh = card.querySelector('#pdWarehouse').value;
          var systemQty = I.stock.filter(function (s) { return s.warehouse === wh; })
            .reduce(function (sum, s) { return sum + Number(s.qty || 0); }, 0);
          if (!I.stocktakes.some(function (x) { return x.no === 'PD-2610-005'; })) {
            I.stocktakes.unshift({
              no: 'PD-2610-005', warehouse: wh, planDate: '2026-10-25',
              counted: counted, diff: counted - systemQty, status: '已完成'
            });
          }
          MES.save();
          stocktakeTable.refresh(I.stocktakes);
          close();
          M.toast('盘点单已提交，差异将自动生成其他出入库单', 'ok');
        });
      }
    });
  }

  /* 库存预警设置 */
  function openThreshold(preset) {
    var cur = preset || I.stock[0];
    var body = '<div class="form-grid">' +
      '<div class="field full"><span class="label">物料</span><select class="select" id="thMaterial">' + materialOptions(cur.code) + '</select></div>' +
      '<div class="field"><span class="label">安全库存</span><input class="input" id="thSafe" type="number" min="0" value="' + M.esc(cur.safe) + '"></div>' +
      '<div class="field"><span class="label">最低库存</span><input class="input" id="thMin" type="number" min="0" value="' + M.esc(cur.min) + '"></div>' +
      '<div class="field full"><span class="label">最高库存</span><input class="input" id="thMax" type="number" min="0" value="' + M.esc(cur.max) + '"></div>' +
    '</div>' +
    '<div class="note" style="margin-top:12px">低于安全库存触发缺料预警，低于最低库存触发紧急补货，高于最高库存标记呆滞风险。</div>';

    M.modal({
      title: '库存预警设置',
      body: body,
      footer: '<div class="spacer"></div><button class="btn" data-close>取消</button><button class="btn primary" id="thSubmit">保存阈值</button>',
      onMount: function (card, close) {
        card.querySelector('#thMaterial').addEventListener('change', function () {
          var item = findStock(this.value);
          if (!item) return;
          card.querySelector('#thSafe').value = item.safe;
          card.querySelector('#thMin').value = item.min;
          card.querySelector('#thMax').value = item.max;
        });
        card.querySelector('#thSubmit').addEventListener('click', function () {
          var min = Number(card.querySelector('#thMin').value) || 0;
          var max = Number(card.querySelector('#thMax').value) || 0;
          var safe = Number(card.querySelector('#thSafe').value) || 0;
          if (max < min) { M.toast('最高库存不能低于最低库存', 'warn'); return; }
          var item = findStock(card.querySelector('#thMaterial').value);
          if (item) {
            item.safe = safe;
            item.min = min;
            item.max = max;
            item.status = item.qty < safe ? '预警' : item.qty > max ? '呆滞' : '正常';
            var alert = I.alerts.filter(function (a) { return a.code === item.code; })[0];
            if (alert) { alert.current = item.qty; alert.safe = safe; }
          }
          MES.save();
          stockTable.refresh(I.stock);
          alertTable.refresh(I.alerts);
          close();
          M.toast('库存阈值已更新，预警状态已同步', 'ok');
        });
      }
    });
  }

  document.getElementById('btnOtherIn').addEventListener('click', openInbound);
  document.getElementById('btnOtherOut').addEventListener('click', openOutbound);
  document.getElementById('btnTransfer').addEventListener('click', function () { openTransfer(); });
  document.getElementById('btnStocktake').addEventListener('click', openStocktake);
  document.getElementById('btnThreshold').addEventListener('click', function () { openThreshold(); });

  /* 快速新建：?new=in / ?new=out */
  var qnew = MES.query('new');
  if (qnew === 'in') setTimeout(function () { openInbound(); MES.clearQuery(); }, 160);
  else if (qnew === 'out') setTimeout(function () { openOutbound(); MES.clearQuery(); }, 160);
});
</script>
</body>
</html>
